# /etc/nginx/sites-available/river-forecast
# Serves forecast.png on localhost only; a Cloudflare Tunnel publishes it.
# Replace YOUR_HOSTNAME with the public hostname routed to the tunnel.
server {
    listen 127.0.0.1:80;
    server_name YOUR_HOSTNAME;

    root /var/www/river_forecast;

    location = /forecast.png {
        add_header Cache-Control "no-cache, max-age=0";
    }

    location / {
        try_files /forecast.png =404;
    }
}
